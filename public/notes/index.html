<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aivora — Application Flow Slideshow</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #050814;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(126, 34, 206, 0.15), transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08), transparent 40%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      height: 52px;
      padding: 0 1.25rem;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #06b6d4, #7e22ce);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    /* Center Title and Counter */
    .title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .slide-counter {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: #06b6d4;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .slide-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
    }

    /* Right Action Controls */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      height: 32px;
      padding: 0 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-icon {
      padding: 0;
      width: 32px;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.8), rgba(79, 70, 229, 0.8));
      border: 1px solid rgba(168, 85, 247, 0.5);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.9), rgba(99, 102, 241, 0.9));
    }

    /* Main Slide Stage */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0.75rem 3.5rem;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.75rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .slide-fade {
      opacity: 0;
      transform: scale(0.99);
    }

    /* Floating Navigation Chevrons */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }

    .nav-arrow:hover {
      background: rgba(168, 85, 247, 0.5);
      border-color: rgba(168, 85, 247, 0.8);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.95);
    }

    .nav-arrow.prev { left: 1rem; }
    .nav-arrow.next { right: 1rem; }

    /* Bottom Compact Thumbnail Rail */
    footer {
      height: 72px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
    }

    .thumb-scroll {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      width: 100%;
      height: 100%;
      align-items: center;
      padding: 0 0.25rem;
    }

    .thumb-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .thumb-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    .thumb-item {
      flex: 0 0 88px;
      height: 52px;
      border-radius: 0.4rem;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: #000;
      transition: all 0.15s ease;
    }

    .thumb-item:hover {
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .thumb-item.active {
      border-color: #06b6d4;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      transform: translateY(-2px);
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-badge {
      position: absolute;
      bottom: 2px;
      right: 3px;
      background: rgba(0, 0, 0, 0.75);
      font-size: 0.6rem;
      font-family: monospace;
      padding: 1px 4px;
      border-radius: 3px;
      color: #cbd5e1;
    }

    .thumb-item.active .thumb-badge {
      color: #06b6d4;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .slide-title {
        display: none;
      }
      main {
        padding: 0.5rem 1rem;
      }
      .nav-arrow.prev { left: 0.25rem; }
      .nav-arrow.next { right: 0.25rem; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <a href="/" class="brand-group" title="Back to App">
      <div class="brand-icon">
        <img src="./img/logo.png" alt="" style="width: 25px;">
      </div>
      <span class="brand-name">Aivora</span>
    </a>

    <!-- Center Slide Title & Number -->
    <div class="title-group">
      <span id="slideCounter" class="slide-counter">01 / 17</span>
      <span id="slideTitle" class="slide-title">Aivora AI Companion — Overview</span>
    </div>

    <!-- Right Controls -->
    <div class="actions-group">
      <button type="button" id="autoPlayBtn" class="btn" title="Toggle Auto-Play (P)">
        <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span id="playText">Auto-Play</span>
      </button>

      <button type="button" id="fullscreenBtn" class="btn btn-icon" title="Toggle Fullscreen (F)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
        </svg>
      </button>

      <a href="https://github.com/devnamdev2003/ai-desktop-assistant/releases/latest" class="btn btn-primary" title="Launch Aivora App">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5m7 7-7-7 7-7" />
        </svg>
        <span>Install Software</span>
      </a>
    </div>
  </header>

  <!-- Main Slide Display -->
  <main>
    <button type="button" id="prevBtn" class="nav-arrow prev" title="Previous (← or A)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>

    <img id="mainSlideImg" class="slide-img" src="./img/first.png" alt="Aivora Slide">

    <button type="button" id="nextBtn" class="nav-arrow next" title="Next (→ or Space)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </main>

  <!-- Compact Bottom Thumbnail Rail -->
  <footer>
    <div class="thumb-scroll" id="thumbScroll">
      <!-- Populated via JS -->
    </div>
  </footer>

  <script>
    const slides = [
      { id: 1, title: "Aivora — Your AI Companion, Right on Your Desktop", image: "./img/first.png"},
      { id: 2, title: "Overall Architecture & Flow", image: "./img/1.png"},
      { id: 3, title: "User Flow — From Open to AI Response", image: "./img/2.png"},
      { id: 4, title: "System Architecture & Internal Flow", image: "./img/3.png"},
      { id: 5, title: "Detailed Data Flow — Chat Request with Screenshot", image: "./img/4.png"},
      { id: 6, title: "Authentication Flow — Email/Password & Google OAuth", image: "./img/5.png"},
      { id: 7, title: "Window Management Flow", image: "./img/6.png"},
      { id: 8, title: "Screen Capture Feature Flow", image: "./img/7.png"},
      { id: 9, title: "Preferences & Settings Flow", image: "./img/8.png"},
      { id: 10, title: "Complete System Architecture", image: "./img/9.png"},
      { id: 11, title: "Build, Deployment & Auto-Update Flow", image: "./img/10.png"},
      { id: 12, title: "Complete Flow Overview", image: "./img/11.png"},
      { id: 13, title: "Security Architecture", image: "./img/12.png"},
      { id: 14, title: "Project Technology Stack & Engineering Summary", image: "./img/13.png"},
      { id: 15, title: "Conversation History & Database Flow", image: "./img/14.png"},
      { id: 16, title: "Thank You — For Exploring Aivora", image: "./img/last.png"}
    ];

    let currentIndex = 0;
    let isAutoPlay = false;
    let autoPlayTimer = null;
    const AUTO_PLAY_INTERVAL = 5000;

    const mainSlideImg = document.getElementById('mainSlideImg');
    const slideCounter = document.getElementById('slideCounter');
    const slideTitle = document.getElementById('slideTitle');
    const thumbScroll = document.getElementById('thumbScroll');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const autoPlayBtn = document.getElementById('autoPlayBtn');
    const playText = document.getElementById('playText');
    const playIcon = document.getElementById('playIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Preload Images
    function preloadImages() {
      slides.forEach(s => {
        const img = new Image();
        img.src = `./${s.image}`;
      });
    }

    // Render Slide
    function renderSlide(index, animate = true) {
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentIndex = index;

      const slide = slides[currentIndex];

      if (animate) {
        mainSlideImg.classList.add('slide-fade');
        setTimeout(() => {
          mainSlideImg.src = `./${slide.image}`;
          mainSlideImg.alt = slide.title;
          slideCounter.textContent = `${String(slide.id).padStart(2, '0')} / ${slides.length}`;
          slideTitle.textContent = slide.title;
          mainSlideImg.classList.remove('slide-fade');
        }, 120);
      } else {
        mainSlideImg.src = `./${slide.image}`;
        mainSlideImg.alt = slide.title;
        slideCounter.textContent = `${String(slide.id).padStart(2, '0')} / ${slides.length}`;
        slideTitle.textContent = slide.title;
      }

      // Update active thumbnail
      document.querySelectorAll('.thumb-item').forEach((el, i) => {
        if (i === currentIndex) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      } else if (isAutoPlay) {
        renderSlide(0);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    // Auto Play
    function toggleAutoPlay() {
      isAutoPlay = !isAutoPlay;
      if (isAutoPlay) {
        playText.textContent = "Pause";
        playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
        clearInterval(autoPlayTimer);
        autoPlayTimer = setInterval(nextSlide, AUTO_PLAY_INTERVAL);
      } else {
        stopAutoPlay();
      }
    }

    function stopAutoPlay() {
      isAutoPlay = false;
      clearInterval(autoPlayTimer);
      playText.textContent = "Auto-Play";
      playIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
    }

    // Build Thumbnail Scroller
    function buildThumbs() {
      thumbScroll.innerHTML = slides.map((s, idx) => `
        <div class="thumb-item ${idx === 0 ? 'active' : ''}" data-index="${idx}" title="${s.title}">
          <img class="thumb-img" src="./${s.image}" alt="${s.title}" loading="lazy">
          <span class="thumb-badge">${String(s.id).padStart(2, '0')}</span>
        </div>
      `).join('');

      thumbScroll.querySelectorAll('.thumb-item').forEach(el => {
        el.addEventListener('click', () => {
          stopAutoPlay();
          renderSlide(parseInt(el.getAttribute('data-index'), 10));
        });
      });
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Touch Gestures
    let touchStartX = 0;
    mainSlideImg.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    mainSlideImg.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 40) {
        stopAutoPlay();
        nextSlide();
      } else if (touchEndX > touchStartX + 40) {
        stopAutoPlay();
        prevSlide();
      }
    }, { passive: true });

    // Events
    prevBtn.addEventListener('click', () => { stopAutoPlay(); prevSlide(); });
    nextBtn.addEventListener('click', () => { stopAutoPlay(); nextSlide(); });
    autoPlayBtn.addEventListener('click', toggleAutoPlay);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Keyboard Shortcuts
    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          stopAutoPlay();
          prevSlide();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
        case ' ':
          e.preventDefault();
          stopAutoPlay();
          nextSlide();
          break;
        case 'p':
        case 'P':
          toggleAutoPlay();
          break;
        case 'f':
        case 'F':
          toggleFullscreen();
          break;
      }
    });

    // Initialize
    preloadImages();
    buildThumbs();
    renderSlide(0, false);
  </script>
</body>
</html>
